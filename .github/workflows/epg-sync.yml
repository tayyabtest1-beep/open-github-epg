name: Global EPG Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Massive global coverage by ISO 639-1 Language Codes
        # en=English, es=Spanish, fr=French, de=German, it=Italian, ar=Arabic, hi=Hindi
        # ur=Urdu (Pakistan), ru=Russian, pt=Portuguese (Brazil/Portugal), zh=Chinese
        # ja=Japanese, ko=Korean, tr=Turkish, nl=Dutch, pl=Polish, sv=Swedish
        # el=Greek, th=Thai, vi=Vietnamese, id=Indonesian
        language: ['en', 'ru', 'es', 'fr', 'de', 'it', 'ar', 'hi', 'ur', 'pt', 'zh', 'ja', 'ko', 'tr', 'nl', 'pl', 'sv', 'el', 'th', 'vi', 'id']
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Grab EPG for Language
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: npx tsx scripts/commands/epg/grab.ts --channels "sites/**/*.channels.xml" --lang ${{ matrix.language }} --output guide-${{ matrix.language }}.xml --maxConnections 20 --days 1 --timeout 3000

      - name: Upload Chunk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: epg-${{ matrix.language }}
          path: guide-${{ matrix.language }}.xml

  merge:
    needs: grab
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all chunks
        uses: actions/download-artifact@v4
        with:
          path: chunks



      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge XML Files
        run: |
          echo "Writing merge script..."
          cat << 'EOF' > merge.js
          const fs = require('fs');
          const path = require('path');
          
          const chunksDir = path.join(__dirname, 'chunks');
          const output = path.join(__dirname, 'global-epg.xml');
          
          let channels = [];
          let programmes = [];
          
          const folders = fs.readdirSync(chunksDir);
          folders.forEach(folder => {
            const folderPath = path.join(chunksDir, folder);
            if (fs.statSync(folderPath).isDirectory()) {
              const files = fs.readdirSync(folderPath);
              files.forEach(file => {
                if (file.endsWith('.xml')) {
                  const content = fs.readFileSync(path.join(folderPath, file), 'utf8');
                  
                  // Extract <channel> blocks
                  const channelMatches = content.match(/<channel[\s\S]*?<\/channel>/g);
                  if (channelMatches) { for (let i = 0; i < channelMatches.length; i++) channels.push(channelMatches[i]); }
                  
                  // Extract <programme> blocks
                  const progMatches = content.match(/<programme[\s\S]*?<\/programme>/g);
                  if (progMatches) { for (let i = 0; i < progMatches.length; i++) programmes.push(progMatches[i]); }
                }
              });
            }
          });
          
          // Deduplicate channels by id
          const uniqueChannels = [];
          const seenIds = new Set();
          channels.forEach(ch => {
            const idMatch = ch.match(/id="([^"]+)"/);
            if (idMatch && !seenIds.has(idMatch[1])) {
              seenIds.add(idMatch[1]);
              uniqueChannels.push(ch);
            }
          });
          
          const finalXml = `<?xml version="1.0" encoding="UTF-8"?>
          <tv generator-info-name="AvelixTV-Global" generator-info-url="https://github.com/tayyabtest1-beep/open-github-epg">
            ${uniqueChannels.join('\n  ')}
            ${programmes.join('\n  ')}
          </tv>`;
          
          fs.writeFileSync(output, finalXml);
          console.log(`Merged ${uniqueChannels.length} channels and ${programmes.length} programs!`);
          EOF
          node merge.js

      - name: Compress Global EPG
        run: |
          gzip -9 -c global-epg.xml > global-epg.xml.gz
          ls -lh global-epg.*

      - name: Commit and Push Compressed Global EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f global-epg.xml.gz
          git commit -m "Automated Global EPG Update (GZIP)" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Upload Master EPG to Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: latest
          name: "Latest Global EPG"
          prerelease: false
          files: |
            global-epg.xml
            global-epg.xml.gz






